model:
    cor_T:
        layers:
            - [256, 128, 64, 16]
            - [128, 64, 32, 16]
            - [64, 32, 8]
            - [32, 16, 8]
    cor_acc:
        layers:
            - [128, 64, 32, 8]
            - [64, 32, 8]
            - [32, 16, 8]
            - [16, 16, 8]
    cor_abl:
        layers:
            - [128, 64, 32, 8]
            - [64, 32, 8]
            - [32, 16, 8]
            - [16, 16, 8]
training:
    Nepochs:
        - 1000
    scheduler_step_size:
        - 250
    weight_decay:
        - 0.0
    lr:
        - 0.001
        - 0.0005
