model:
    type: TIlike
    inputs:
        - ELEVATION_DIFFERENCE
        - aspect
        - fal
        - slhf
        - slope
        - sshf
        - ssrd
        - str
        - t2m
        - tp_sum
        - svf
        - u10
        - v10
        - POINT_LAT
        - POINT_LON
        - POINT_ELEVATION
    # Normalization bounds [lower, upper] replacing the global ones of
    # config.DEFAULT_BNDS; a feature not listed keeps its global bounds. With the global
    # (-90, 90) and (-180, 180), the Alps span about 0.02 of the normalized range, and
    # the networks on POINT_LAT/POINT_LON learned a correction that is constant over the
    # region (P_cor 0.682 +- 0.001 in geo_20261106_160700_stage1). The RGI outlines of the
    # glaciers of splits/central_europe.yml (stakes and geodetic windows) span
    # 44.9-47.6 N and 6.1-13.6 E; the Pyrenees (42.5 N, -0.3 E) lie outside.
    normalization:
        POINT_LAT: [44.5, 48.0]
        POINT_LON: [5.5, 14.0]
    grad_T:
        inputs:
            - t2m
            - ssrd
            - str
        layers: [32, 16, 16]
        min: -8.0
        max: -6.0
    bias_T:
        inputs:
            - POINT_LAT
            - POINT_LON
        layers: [32, 16, 8]
        b_max: 3.0
    cor_acc:
        inputs:
            - u10
            - v10
            - slope
        layers: [32, 16, 8]
    cor_abl:
        inputs:
            - fal
            - str
        layers: [32, 16, 8]
        # With sfc_type, cor_abl is the melt factor of SNOW, that of ice being
        # ice_ratio * cor_abl. With beta2 = 1 it is in m w.e. K-1 month-1, the degree-day
        # factor in mm w.e. K-1 d-1 times 30.4 / 1000.
        # Snow 2-7 mm w.e. K-1 d-1 (0.061-0.213), so ice 2.9-10 with the default
        # ice_ratio 1 / 0.7: the upper bound of ice is that of the single factor of the
        # baseline (3-10). Snow: PyGEM's prior ddfsnow 4.1 +- 1.5; OGGM SfcTypeTIModel
        # calibrated on the pre-2000 windows of the region (central_europe_oggm_sfc,
        # 52 entities), ice melt_f of median 4.9-9.9 per source, i.e. 3.4-6.9 for the
        # snow of the season it melts at 0.7 of ice.
        output: sigmoid
        min: 0.061
        max: 0.213
    # Surface type of the ablation: snow cover from the cumulative balance since the 1st
    # of October (snow fraction sigmoid(SWE / snow_scale), SWE in m w.e.). ice_ratio is
    # fixed by default at 1 / 0.7 (PyGEM, and OGGM's snow after aging, see
    # models.TorchNeuralNetworkRegressor.DEFAULT_ICE_RATIO); `trainable: true` with
    # `min` and `max` learns it.
    sfc_type:
        snow_scale: 0.1
    bias_cor:
        inputs:
            - POINT_LAT
            - POINT_LON
        layers: [32, 16, 8]
        p_min: 0.25
    bias_cor_elev:
        inputs:
            - ELEVATION_DIFFERENCE
        layers: [16, 8]
    sw_contrib:
        inputs:
            - aspect
            - slope
            - svf
            - ssrd
            - fal
            - ELEVATION_DIFFERENCE
        layers: [32, 16, 8]
    trainable:
        tau_P_c: false   # snow/rain threshold temperature: stays at 1.0
        tau_P_s: false   # snow slope: stays at snow_slope.init
        beta_pdd: false  # PDD curvature: stays at 1.0
    # Scaling of the ablation term (default 0.0049): 1 makes cor_abl a physical
    # degree-day factor in m w.e. K-1 month-1.
    beta2: 1.0
training:
    # Central Europe (RGI 11) and the Himalayas (RGI 13, 14, 15), each with its own
    # validation split, written by its split notebook. source_data, the glacier lists and
    # the geodetic sources are merged from the region blocks (cli.common.mergeRegions).
    regions:
        central_europe:
            split_file: splits/central_europe.yml
    splitTest: YEAR:<2000
    # 0 trains on the stakes only. The geodetic run reuses this file with --wGeo, so that
    # both experiments share the same split.
    wGeo: 0.0
    # Weight the geodetic loss term of every window by its area (normalized to a mean
    # of 1, see training.geodeticAreaWeights). The stake term is not weighted.
    areaWeightGeo: false
    optim: ADAM
    scheduler: StepLR
    lr: 2e-4
    scheduler_step_size: 500
    Nepochs: 2000
    NepochsGeo: 200
    wGeoSchedule: [5e-2]
    scalingStakes: full
    # Weights of the winter and summer stakes in the stake loss (annual: 1). The model
    # traded winter accumulation against summer melt (geo_20261106_160700: winter -0.5,
    # summer +0.4 m w.e. on the training stakes), which are ~1200 each against ~8700
    # annual stakes.
    wWinter: 5.0
    wSummer: 5.0
    bestModelCriterion: lossVal
    climate_source: gswp3_w5e5
