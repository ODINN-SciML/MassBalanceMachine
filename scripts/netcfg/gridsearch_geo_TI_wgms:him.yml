            - [32, 16, 8]
            - [16, 8]
    cor_acc:
        layers:
            - [32, 16, 8]
            - [16, 8]
    cor_abl:
        layers:
            - [32, 16, 8]
            - [16, 8]
    bias_cor:
        layers:
