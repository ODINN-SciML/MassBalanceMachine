model:
    type: TIlike
    inputs:
        - ELEVATION_DIFFERENCE
        - aspect
        - fal
        - slhf
        - slope
        - sshf
        - ssrd
        - str
        - t2m
        - tp_sum
        - svf
        - u10
        - v10
        - POINT_LAT
        - POINT_LON
        - POINT_ELEVATION
    # Normalization bounds [lower, upper] replacing the global ones of
    # config.DEFAULT_BNDS; a feature not listed keeps its global bounds. With the global
    # (-90, 90) and (-180, 180), Norway spans about 0.06 of the normalized range, and
    # the networks on POINT_LAT/POINT_LON cannot tell its glaciers apart. The stakes
    # (NVE and WGMS, Sweden included) and the RGI outlines of the NVE glaciers span
    # 59.9-70.2 N and 5.6-21.8 E.
    normalization:
        POINT_LAT: [59.5, 70.5]
        POINT_LON: [5.0, 22.0]
    grad_T:
        inputs:
            - t2m
            - slhf
            - sshf
            - ssrd
            - str
        layers: [32, 16, 16]
        # Range of the temperature lapse rate (°C/km). Default: [-15, -2].
        min: -8.0
        max: -5.0
    bias_T:
        inputs:
            - POINT_LAT
            - POINT_LON
        layers: [32, 16, 8]
        b_max: 3.0
    cor_acc:
        inputs:
            - u10
            - v10
            - slope
        layers: [32, 16, 8]
    cor_abl:
        inputs:
            - fal
            - slhf
            - sshf
            - ssrd
            - str
        layers: [32, 16, 8]
    bias_cor:
        inputs:
            - POINT_LAT
            - POINT_LON
        layers: [32, 16, 8]
        p_min: 0.1
    bias_cor_elev:
        inputs:
            - ELEVATION_DIFFERENCE
        layers: [16, 8]
    sw_contrib:
        inputs:
            - aspect
            - slope
            - svf
            - ssrd
            - fal
            - ELEVATION_DIFFERENCE
        layers: [32, 16, 8]
        max: 5.0
    snow_slope:
        min: 0.8    # 1/°C, default 0.0
        max: 4.0    # default 4.0
    trainable:
        tau_P_c: true    # snow/rain threshold temperature
        tau_P_s: false   # snow slope: stays at snow_slope.init
        beta_pdd: false  # PDD curvature: stays at 1.0
    beta1: 3.0
training:
    regions:
        norway:
            split_file: splits/norway.yml
    # Test on the stakes from 2000 on, the year_split splits/norway.yml was drawn with.
    # Engabreen's training window 1968-2001 is the only geodetic one reaching past it.
    splitTest: YEAR:<2000
    # 0 trains on the stakes only. The geodetic run reuses this file with --wGeo, so that
    # both experiments share the same split.
    wGeo: 0.0
    # Weight the geodetic loss term of every window by its area (normalized to a mean
    # of 1, see training.geodeticAreaWeights). The stake term is not weighted.
    areaWeightGeo: false
    # Lower bound (m w.e. a-1) on the 1 sigma error of the geodetic windows in the loss,
    # so that a window with a very small error does not dominate it. null: no floor.
    errGeoFloor: 0.1
    # With a geodetic term, one optimizer step per epoch on the gradient averaged over
    # the geodetic glaciers, instead of one step per geodetic glacier.
    geoStepPerEpoch: true
    optim: ADAM
    scheduler: StepLR
    lr: 1e-3
    scheduler_step_size: 500
    Nepochs: 2000
    NepochsGeo: 1000
    wGeoSchedule: [0.05]
    scalingStakes: full
    bestModelCriterion: lossVal
