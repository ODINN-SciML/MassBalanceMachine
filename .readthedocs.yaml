

# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# Required
version: 2

# Set the OS, Python version, and other tools you might need
build:
  os: ubuntu-24.04
  tools:
    python: "3.11"
  jobs:
    post_create_environment:
      - pip install poetry poetry-plugin-export
      - poetry config virtualenvs.create false
    post_install:
      # Install the CPU build of torch: the default Linux wheel pulls several GB of CUDA
      # libraries that the documentation does not need. `poetry install` would replace it
      # with the CUDA build, so the dependencies are exported and installed with pip.
      - poetry lock
      - poetry export --with docs --without-hashes -o requirements-docs.txt
      - grep -oE '^torch==[^;[:space:]]+' requirements-docs.txt | xargs python -m pip install --index-url https://download.pytorch.org/whl/cpu
      - grep -vE '^(torch|triton|nvidia-[^=]+)==' requirements-docs.txt > requirements-docs-cpu.txt
      - python -m pip install -r requirements-docs-cpu.txt
      - python -m pip install --no-deps .


# Build documentation in the "docs/" directory with Sphinx
sphinx:
  configuration: docs/conf.py
  fail_on_warning: true
